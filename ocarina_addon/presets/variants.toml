# Preset variants: one body each, built on a preset of cavity_presets.toml (`base`) with some values replaced.
# A variant is an OPTION, not a rule: the presets, the rule tables and every stage stay as they are.
#
#   blender -b --factory-startup --python tools/geometry_check_variant.py -- P4-bowl 80 x      (the body P4-bowl-80-x)
#
# Besides the preset keys of cavity_presets.toml, a variant may set
#   rating              "soft", "medium" or "loud": the voice rating its body is built at when none is given
#   windway_length_mm   the pipe's length, replacing [voicing_rules] windway_length_mm (it is in the voicing hash)
# and the option keys of the add-on (all off by default):
#   wall_front_less_mm, wall_back_more_mm, wall_refine_mm   the uneven wall (shell_edit.py): thinner on the finger deck,
#                                                           thicker on the thumb face, the skin refined near the window
#   neck_tilt_deg                                           the neck's outside turned toward the thumb face (not hashed)
#   window_cut = "bowl", bowl_*                             the round bowl around the window (bowl_cut.py; in the hash)
#   thumb_offsets_mm = { L_thumb = [ds, dw] }               a thumb hole moved in the template's deck coordinates (mm;
#                                                           ds along the hand axis, + toward the tail): an ergonomic change

schema = "ocarina-preset-variants-v1"

# Low voicing with the round bowl: trial s3-yH7 of the low-voicing experiment (Analizes_ocarinas/Low_voicing/,
# Round_b4_log.md), chosen by the owner on 2026-11-25: "s3-yH7 (xw 22)", "Keep yH7's flow", "Keep it level".
# Not decided: whether the left thumb hole moves (thumb_offsets_mm; Round_h7_log.md), the window's sizing with the
# rounded walls (the kernel's t_eff, see the build notes), and whether this becomes a rule. Unprinted; no eta_w is known
# for its voicing hash (doc 04, R11).
[P4-bowl]
base = "P4"
rating = "soft"                    # the round window: 8.89 x 9.05 mm at 80 cm3 (the soft length, tip radius 1.0)
windway_length_mm = 57.0           # the long pipe of series 3
port_angle_deg = 20.0
windway_pitch_deg = 4.0            # the pipe +4 deg against the body
stub_pitch_deg = 4.0
neck_base_width_mm = 25.4          # the owner's cone neck, 25.4 -> 15.2 mm
neck_base_depth_mm = 25.4
neck_width_exponent = 1.0
neck_side_wall_mm = 3.197
neck_floor_mm = 10.0
neck_tilt_deg = 6.0                # the neck's outside tilted 6 deg toward the thumb face
wall_front_less_mm = 1.0           # 3 mm on the finger deck
wall_back_more_mm = 2.0            # 6 mm on the thumb face
wall_refine_mm = [30.0, 24.0]      # the skin split once within 30 mm of the window and once more within 24 mm
window_cut = "bowl"                # the bowl's numbers are the record's defaults (kernel voicing.BOWL_BUILD), s3-yH7's
