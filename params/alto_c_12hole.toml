# Parametric alto C 12-hole ocarina: global parameter set (baseline, pre-calibration)
#
# Read by kernel/alto_c_study.py (Python 3.11+ tomllib). Later read by the Blender add-on.
# Every value carries a status:
#   LOCKED      part of the frozen voicing module; changing it means a new module + new calibration print
#   LINKED      re-solved by the kernel on every geometry change; never typed in by hand
#   CALIBRATE   placeholder until the calibration print measures it (per printer + material + voicing module)
#   TARGET      a musical or design choice
# Sources are in docs/01-source-review.md; the derivations are in docs/03-parametric-findings.md.

schema_version = 1

[design]                                   # TARGET
name               = "alto_c_12hole"
a4_hz              = 440.0
temperament        = "12-TET"
design_air_temp_c  = 27.0                  # breath-warmed internal air (build plan); record the real value on the calibration print
# Linear (cumulative) fingering, all closed -> all open. 13 notes, 12 holes.
notes              = ["A4", "B4", "C5", "D5", "E5", "F5", "G5", "A5", "B5", "C6", "D6", "E6", "F6"]
notes_midi         = [69, 71, 72, 74, 76, 77, 79, 81, 83, 84, 86, 88, 89]
chromatic_range    = 21                    # A4..F6 inclusive; accidentals by half-holing / cross-fingering

[voicing]                                  # LOCKED (one rigid module)
# Window = distance from windway exit to labium edge (Heuer's definition).
# Heuer #3 C fired band: 8.13 too small | 8.89 soft | 9.65 medium | 10.41 loud | 11.18 too large (mm)
window_length_mm        = 8.9              # start at the soft end (high-note safeguard 1); coupons sweep 8.9 / 9.3 / 9.65
window_max_width_mm     = 6.0              # MEASURE on the reference STL; teardrop assumed
window_tip_radius_mm    = 1.0              # teardrop small-end radius; orientation to be taken from the reference
window_shape            = "teardrop"       # area = convex hull of two circles, see kernel.teardrop_area
wall_at_window_mm       = 3.0              # deeper throat = voicing neck (safeguard 3)
windway_exit_height_mm  = 1.20             # Heuer 0.045 in = 1.14 mm; 1.20 is a whole number of 0.1/0.12/0.15/0.2/0.3 mm layers
windway_width_mm        = 6.0              # = window max width
windway_length_mm       = 30.0             # 20..40, converging toward the exit
windway_taper_ratio     = 1.3              # inlet height / exit height (starting value)
labium_ramp_angle_deg   = 20.0             # 15..25
labium_edge_thickness_mm= 0.4              # 0.3..0.5, blunt, printer minimum feature
labium_offset_mm        = 0.0              # edge vs windway centreline; sweep +-0.3 on coupons
keepout_inside_mm       = 10.0             # no chamber wall within this distance behind/below the labium
keepout_outside_flare_deg = 45.0           # shell flare angle around the window

[acoustics]                                # CALIBRATE (priors shown)
eta_w        = 0.90    # window efficiency. Measured on real instruments: 0.86 (ECAN3 V0N3), 0.89 (Eclipse), ~0.9 (Miracle). The LES study's 0.5..0.8 is weak (docs/01 section 5).
k_window     = 0.80    # FIXED. End-correction coefficient of the window. eta_w is defined under this convention; eta_w and k cannot be separated for the window.
k_hole_prior = 1.00    # CALIBRATE. Prior for the holes (ECAN3 fit 0.90..1.05; theory 0.785..0.85). Fitted from the test bodies.
k_hole_first_print = 0.80   # first prints use the k 0.8 hole diameters, so notes err flat and reaming can fix them. Also the k behind the doc 03 baseline.
hole_offset_mm = 0.0   # printed minus designed diameter (FDM usually negative)
volume_factor  = 1.0   # printed cavity / designed cavity
pressure_curve_alpha = 1.2   # p ~ f^alpha along the tuned breath curve; alpha = 2 means constant Strouhal

[breath]                                   # CALIBRATE (assumed until measured with a manometer)
p_low_pa       = 150.0                     # pressure at the lowest note
strouhal_low   = [0.20, 0.30]              # acceptable band on the lowest note
strouhal_high  = [0.30, 0.40]              # acceptable band on the highest note

[constraints]                              # solver guard rails
hole_min_d_mm          = 3.0
finger_max_d_mm        = 10.0
thumb_max_d_mm         = 12.0
hole_edge_spacing_d    = 1.0               # edge-to-edge spacing, in hole diameters
hole_flat_land_d       = 1.5               # flat land diameter around each exit, in hole diameters
hole_to_window_min_mm  = 10.0
range_ratio_max        = 10.0              # sum(G_i) / (eta_w * G_w); A4..F6 needs 9.08 by arithmetic
cavity_mode_margin     = 1.0               # require c/(2 L_int) >= margin * f_top (hard limit); FEM below 1.3
cavity_mode_fem_margin = 1.3               # between 1.0 and 1.3 the check says "needs FEM" (doc 03 section 8)
fdm_min_perimeters     = 3                 # airtightness
mesh_hole_segments     = 64                # or compensate radius, kernel.polygon_circumradius_for_area
volume_tolerance_rel   = 0.005             # air mesh volume within 0.5 % of target

# Holes in opening order. chimney_mm = core wall + shell along the hole axis (LINKED in the add-on;
# uniform 3 mm here = Phase 3 plain instrument).
# The order is the ASIAN fingering system (owner decision 2026-11-18, docs/09 section 6.1): after the right
# hand, the left ring finger lifts first (A5), then L middle, L index, the left thumb (D6), the right thumb (E6)
# and the left pinky last (F6). Source: Pure Ocarinas, "The ocarina's fingering system". Until 2026-11-18 this
# table opened L pinky for A5 and the thumbs for E6 and F6, which no chart uses.
# The two subholes are split, one per hand (owner decision 2026-11-15): sub1 is the LEFT one (forward of L ring)
# and opens B4; sub2 is the RIGHT one (forward of R middle) and opens C5. The same source: "B: right subhole
# closed", "A: both subholes closed". Both subhole fingers stay on their main holes for A4 to C5, and L ring is
# the first left finger to lift (A5), after both subholes are open. So the two decisions do not interfere.
[fingering]
holes = [
  { name = "sub1", opens = "B4", finger = "subhole 1 (left; B4 = right subhole still closed)", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "sub2", opens = "C5", finger = "subhole 2 (right)", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "R_pinky", opens = "D5", finger = "right pinky", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "R_ring", opens = "E5", finger = "right ring", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "R_middle", opens = "F5", finger = "right middle", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "R_index", opens = "G5", finger = "right index", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "L_ring", opens = "A5", finger = "left ring", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "L_middle", opens = "B5", finger = "left middle", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "L_index", opens = "C6", finger = "left index", chimney_mm = 3.0, max_d_mm = 10.0 },
  { name = "L_thumb", opens = "D6", finger = "left thumb", chimney_mm = 3.0, max_d_mm = 12.0 },
  { name = "R_thumb", opens = "E6", finger = "right thumb", chimney_mm = 3.0, max_d_mm = 12.0 },
  { name = "L_pinky", opens = "F6", finger = "left pinky (stays down to hold the instrument until the top note)", chimney_mm = 3.0, max_d_mm = 10.0 },
]

[heuer_chart]                              # reference data (Chris Heuer, Video #2), fired values, inches
sizes          = ["#1 C", "#2 G/F", "#3 C", "#4 G/F", "#5 C", "#6 G/F", "#7 C"]
nominal_key_hz = [1046.50, 740.00, 523.25, 370.00, 261.63, 185.00, 130.81]  # C6, sqrt(G5*F5), C5, ..., C3
exit_in        = [0.030, 0.045, 0.045, 0.045, 0.060, 0.060, 0.060]
window_in      = [0.20, 0.30, 0.38, 0.45, 0.60, 0.80, 1.00]
alto_band_in   = [0.32, 0.35, 0.38, 0.41, 0.44]   # X, soft, medium, loud, X
alto_wet_in    = 0.428                            # Heuer's wet (clay) value for 0.38 fired


# ---------------------------------------------------------------------------
# Test-phase rules (docs/04-testing-phase.md). Read by kernel/voicing.py, holes.py, sizing.py.
# These are rules that GENERATE the voicing and the holes. They are separate from [voicing] above,
# which is the doc 03 baseline and stays as it is so that kernel/alto_c_study.py keeps reproducing doc 03.
# ---------------------------------------------------------------------------

[voicing_rules]                            # LOCKED (a change is a new rule version and a new hash)
# Version 2 since 2026-11-18 (owner decisions 2 to 6 of that day, Analizes_ocarinas/Decisions_2026-11-18/decisions.md):
# the windway is 3.0 mm high at the mouth end (taper 2.5, was 1.3), and the build of the voicing is part of the rule.
rule_version            = 2
rating_window_mm        = { soft = 8.89, medium = 9.65, loud = 10.41 }   # Heuer #3 C fired band
default_rating          = "medium"
default_wall_at_window_mm = 4.0
# Wall at the window: one of these (doc 04, "Window wall option"). 4.0 mm is the default of the test bodies.
# 3.0 mm makes the window narrower at the same V0, so it stays a teardrop up to 96.9 cm3 (88.6 cm3 at 4.0 mm).
# The wall is hashed, so each wall gets its own voicing hash and its own eta_w.
window_wall_options_mm  = [3.0, 4.0]
eta_w_prior             = 0.90             # window efficiency used to solve the window area (CALIBRATE)
teardrop_tip_radius_mm  = 1.0              # small-end radius at the labium. Owner decision 2026-11-17: keep 1.0 mm (matches Heuer's Video #8 model; docs/01 section 5.5)
# The window is a teardrop at every volume (owner decision 1, C2b). Up to the volume where the broad end is a
# circle as wide as the window is long (88.6 cm3, medium window) the outline is the hull of two circles.
# Above it the teardrop is wider than long: the broad end is an ellipse of half-width a = width / 2 and
# half-length b = (length / 2) * (length / width) ^ teardrop_wide_exponent. See kernel/voicing.py.
teardrop_wide_exponent  = 0.3333333333333333
rect_corner_radius_mm   = 1.0              # rounded rectangle corner radius. Forced shape only (stub V-b); never chosen by rule.
windway_exit_height_mm  = 1.20
windway_length_mm       = 30.0
# Mouth-end height / exit height. 2.5 = 3.0 mm at the mouth end (owner decision 4 of 2026-11-18; 1.3 = 1.56 mm before).
# The references have 2.5 to 4.5 mm at the mouth end; the laminar loss in the slot falls from about 36 % to 15 %
# of the jet's pressure on the low notes (Analizes_ocarinas/Kernel_challenge/kernel_vs_references.md, part 5).
windway_taper_ratio     = 2.5
wh_ratio_band           = [7.0, 10.0]      # W/h must stay inside this band
labium_ramp_angle_deg   = 20.0
labium_edge_thickness_mm = 0.4
# Labium height (owner decision 2026-11-17, Heuer Videos #3, #6, #8: the lip sits "below the halfway mark").
# Offset = mid-height of the labium edge minus the windway centre line, positive outward.
# NEGATIVE = edge on the chamber side of the jet = Heuer's "below centre, towards the bottom".
# Never positive; the lip must stay visible above the windway floor. The far coupon is -0.35, not -0.4: at -0.4
# the windway floor past the exit lies exactly on the pocket ceiling (z = 0), a coplanar Boolean case; at -0.35
# it is 0.05 mm below it (the add-on's clearance). Test: test_every_labium_option_keeps_the_floor_clear.
default_labium_offset_mm = -0.2
labium_offset_options_mm = [-0.35, -0.2, 0.0]  # -0.2 default; 0 and -0.35 are the coupons (stubs V-a0 / V-a35)
keepout_inside_mm       = 10.0
keepout_outside_flare_deg = 45.0
# The build of the voicing: how the add-on cuts the window and shapes the mouthpiece (owner decisions of 2026-11-18).
# Until then every body had the PLAIN build: fan cut, level windway, box stub, no blend. The build is part of the
# voicing record and of its hash whenever it differs from the plain build (kernel/voicing.py, BUILD_FIELDS), so a
# stub and a body share an eta_w only when they share the build. Stub V-af carries the plain build on purpose.
window_cut              = "ellipse"        # decision 2: one smooth dish, lofted from the window outline to an ellipse at the outer face ("fan" = plain)
cut_widen_mm            = 3.0              # decision 2 ("P3"): the dish reaches 3 mm beyond the window on each side at the outer face
shelf_angle_deg         = 40.0             # decision 2 ("P3"): the wall above the windway exit leans back 40 deg from the normal
pocket_blend_radius_mm  = 12.0             # the pocket ceiling falls away behind the labium on this radius until it meets the chamber wall (smooth cavity; 0 = a step)
stub_style              = "neck"           # the mouthpiece is a neck that flares into the body ("box" = plain)
stub_pitch_deg          = 15.0             # decision 6: the neck stands 15 deg off the body (positive = the mouth end away from the body)
# The windway is turned about the labium edge, so the jet still aims at the edge. Measured against the body:
# positive = the mouth end is raised and the jet enters the chamber. The pipe is LOWERED inside the neck by
# stub_pitch_deg - windway_pitch_deg = 10 deg, toward the body, hidden by the neck (the owner's "lowered").
# With a neck that stands 15 deg, a pipe at -2.5 deg against the body (the angle agreed for the level neck) does
# not reach the mouth end of the neck; +5 deg is the body the owner chose from the picture (P4-80-el-d-p3-stand).
windway_pitch_deg       = 5.0

[hole_rules]
wall_at_holes_mm        = 4.0              # finger deck and thumb wall of the test bodies (D3)
tube_step_mm            = 0.5              # inward tube lengths are rounded up to this step
tube_max_mm             = 15.0             # longest inward tube the sizing will propose
tube_wall_mm            = 1.2              # wall of an inward tube (about 3 perimeters); used for the displaced-air figure
print_k_hole            = 0.80             # k behind the printed diameters of the first prints
nominal_k_hole          = 1.00             # k behind the nominal diameters shown beside them

[temperature]                              # one rule, shared by sizing and the fitter
design_internal_c       = 27.0             # breath-warmed air inside the body (design value)
reference_room_c        = 22.0             # room temperature at which the internal air is the design value
room_coupling           = 0.31             # internal air changes 0.31 degC per degC of room (0.9 / 2.9 cents per degC, doc 03 section 9)

# ---------------------------------------------------------------------------
# Soft ergonomic checks of the add-on (ocarina_addon/ergonomics.py). They WARN and never fail.
# Limits: the "Proposed" column of docs/06-ergonomics-challenge.md section 5 (owner decision of 2026-11-15).
# They are the range of the three reference layouts with a true scale, widened a little.
# The kernel does not read this table.
# ---------------------------------------------------------------------------

[ergonomics]
finger_pitch_mm            = [16.5, 20.5]   # neighbouring finger holes of one hand, straight 3D distance between centres
hand_span_mm               = [50.0, 60.0]   # pinky to index of one hand, plan view
arch_mm                    = [0.5, 7.0]     # ring and middle off the pinky -> index line, + toward the fingertips
hands_parallel_max_deg     = 10.0           # angle between the two hand lines
hand_offset_mm             = [18.0, 28.0]   # the right-hand line nearer the player than the left-hand line
index_across_mm            = [18.0, 28.0]   # R index from L index, across the hand axis (toward the player)
index_along_mm             = [-22.0, 5.0]   # R index from L index, along the hand axis (- = the hands overlap)
subhole_distance_mm        = [7.0, 11.0]    # subhole from its nearest finger hole. The upper value is also the largest slide of the layout.
subhole_off_normal_max_deg = 20.0           # subhole direction against the normal of that hand's line
rest_space_min_mm          = 10.0           # land past each pinky hole, from the hole edge, along the hand axis
hole_lean_end_max_deg      = 20.0           # lean of a finger hole along the hand axis toward the nearer end
hole_lean_side_max_deg     = 45.0           # lean across the hand axis toward the hand that covers the hole
hole_lean_side_away_max_deg = 5.0           # lean away from that hand. Doc 06 says "warn if it leans away" and gives no number; the references have at most 0.5 deg. Set by the C4b session, not by the owner.
r_thumb_from_r_middle_mm   = [-8.0, 3.0]    # along the hand axis, + toward the tail
l_thumb_from_l_pinky_mm    = [4.0, 10.0]
