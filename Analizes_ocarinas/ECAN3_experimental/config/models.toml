# Per-model configuration for tools/analyze_model.py
#
# Frame after loading (and the optional rotation): x = body length (bulb <-> tail),
# y = thickness (the two playing faces), z = height; all three models are
# exported standing on the mouthpiece (z = 0 is the mouthpiece tip).
#
# holes: name -> approximate centre [x, y, z] (mm) of the opening, in the model frame.
#   The pipeline snaps each name to the nearest detected opening. Positions come
#   from a first run with no map (output/<model>/openings.txt) plus the face renders.
# order: holes in the order they open (cumulative fingering, all closed -> all open).
# notes: the scale, lowest first (len(order) + 1 notes).

[defaults]
voxel_mm        = 0.30
ball_R_mm       = 8.0      # > largest hole radius; the ball must not pass a hole
cut_radius_mm   = 0.8      # severs the windway (~1.2-1.5 mm high) from the cavity
wall_close_mm   = 2.5      # closing radius for internal walls (walls up to ~5 mm thick)
neck_radius_mm  = 2.5      # sub-volumes = parts joined only through gaps narrower than 2 x this
cell_mm         = 4.0      # cell size for the acoustic network
attach_mm       = 7.0      # geodesic attachment radius of an opening (validated in test_cellnet.py)
k_end           = 0.80     # kernel end-correction coefficient
temp_c          = 27.0     # kernel design temperature

